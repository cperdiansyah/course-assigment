<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        if (s === 'light' || s === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
        var isDark = s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {}
    </script>

    <title>Timeline Tugas Kuliah — Gantt, Agenda & Perjalanan</title>
    <meta
      name="description"
      content="Pelacak jadwal, progres, dan deadline tugas kuliah dengan tampilan Timeline Gantt, Agenda, dan Perjalanan. Mendukung import/export CSV dan Add to Calendar."
    />
    <meta name="theme-color" content="#4F46E5" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph / WhatsApp / Discord / LinkedIn Preview -->

    <meta property="og:site_name" content="Timeline Tugas Kuliah" />

      property="og:description"
      content="Pelacak jadwal, progres, dan deadline tugas kuliah dengan tampilan Timeline Gantt, Agenda, dan Perjalanan. Mendukung import/export CSV dan Add to Calendar."

    <meta property="og:url" content="https://cperdiansyah.github.io/course-assigment/" />

    <meta property="og:image:width" content="1200" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
